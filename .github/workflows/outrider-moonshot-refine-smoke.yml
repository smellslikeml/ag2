name: Outrider Moonshot refine smoke (ag2)

# Third refinement smoke — multi-agent domain, fitting ag2's
# (AutoGen) multi-agent framework surface. Exercises the shipped stack:
#   - `provider: moonshot` action input (v1.7.29)
#   - Per-model rate table (v1.7.29)
#   - Bot-token TTL fix (v1.7.31)
#   - Research phase inherits claude-timeout (v1.7.32)
#   - fidelity_skipped_* continues to convention + test (v1.7.33)
#
# Manual-only.

on:
  workflow_dispatch:
    inputs:
      pick-override:
        description: 'Drafter branch to refine.'
        required: false
        default: 'webswarm-recursive-multi-agent-orchestration-for-deep-and-wi-v2'
      pin-arxiv:
        description: 'arxiv_id (bypasses selection).'
        required: false
        default: '2604.02369v3'

concurrency:
  group: outrider-moonshot-refine-smoke
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: remyxai/outrider@v1
        env:
          REMYX_API_KEY: ${{ secrets.REMYX_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
        with:
          interest-id: 8eac771b-9f9d-4de9-8103-f9711e8bea18
          mode: recommend
          publish: pr
          provider: moonshot
          model: kimi-k3
          pin-arxiv: ${{ inputs.pin-arxiv }}
          start-from-ref: ${{ inputs.pick-override }}
          lead-content: |
            REFINEMENT PASS on an existing drafter branch.

            Read the existing changes on this branch (SPEC.md if present,
            plus the actual code changes), compare against the paper
            (arxiv:2604.02369v3 — WebSwarm: Recursive Multi-Agent Orchestration
            for Deep and Wide Research), and refine the implementation to
            better match the paper's mechanism.

            Focus on MECHANISM-LEVEL divergences:
              - Wrong recursion / orchestration structure (depth-first vs
                breadth-first traversal, budget accounting, tree pruning)
              - Missing paper rules (agent-role differentiation, question
                decomposition strategy, aggregation semantics, verification
                loop)
              - Invented behaviors not in the paper
              - Category errors (misapplying multi-agent recursion to a
                single-agent shape — this repo is ag2 (AutoGen 2.0), so the
                natural landing surface is a new agent class or orchestrator
                extension composing with existing AutoGen primitives:
                ConversableAgent, GroupChat, GroupChatManager)

            Not stylistic polish. If the branch is already faithful, verify
            with focused pytest additions rather than restructuring.
          staged-synthesis: 'true'
          claude-timeout: '3600'
          rate-limit-days: '0'
